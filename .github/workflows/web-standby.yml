name: Isolated Web WeChat image
on:
  push:
    branches: ["master"]
    paths: ["web-image/**", ".github/workflows/web-standby.yml"]
  pull_request:
    branches: ["master"]
    paths: ["web-image/**", ".github/workflows/web-standby.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Explicitly publish web images from master (never deploy hosts)"
        type: boolean
        default: false
      maintenance:
        description: "Use pinned production runtime for topic-guard maintenance"
        type: boolean
        default: false
concurrency:
  group: web-standby-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  packages: read
jobs:
  web-image:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - if: github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/master'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build separate web image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ${{ inputs.maintenance && 'web-image/Dockerfile.maintenance' || 'web-image/Dockerfile' }}
          load: true
          push: false
          tags: |
            ghcr.io/shaoyou11/efb-web-standby:20260927
            ghcr.io/shaoyou11/efb-web-standby:${{ github.sha }}
          build-args: |
            EFB_IMAGE_SOURCE_REF=${{ github.sha }}
          cache-from: type=gha,scope=web-standby
          cache-to: type=gha,mode=max,scope=web-standby
      - name: Offline runtime and activation guards
        run: |
          set -eu
          image=ghcr.io/shaoyou11/efb-web-standby:20260927
          docker run --rm --network none --read-only --tmpfs /tmp --cap-drop ALL "$image"
          if docker run --rm --network none --read-only --tmpfs /tmp -e EFB_WEB_ENABLE_LOGIN=1 -e EFB_PROFILE=comwechat "$image"; then exit 1; fi
          docker run --rm --network none --entrypoint python "$image" -c "import importlib.util; assert importlib.util.find_spec('pip') is None"
          docker run --rm --network none --read-only --tmpfs /tmp --entrypoint python "$image" /opt/efb-backend-control/test_dependency_compat.py
          docker run --rm --network none --read-only --tmpfs /tmp --entrypoint python "$image" /opt/efb-web/test_binding_sync.py
          docker run --rm --network none --read-only --tmpfs /tmp --entrypoint python -w /opt/efb-backend-control "$image" -m unittest test_notifications test_notification_ha
      - name: Independent bridge regression (no network or private config)
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp --memory 512m --cpus 1 --cap-drop ALL --entrypoint python ghcr.io/shaoyou11/efb-web-standby:20260927 -m unittest discover -s /opt/efb-imessage -q
          python3 -m unittest discover -s web-image/imessage/mac -q
      - name: Scan runtime vulnerabilities before publishing
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ghcr.io/shaoyou11/efb-web-standby:20260927
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: json
          output: web-trivy-report.json
      - name: Retain vulnerability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-runtime-security
          path: web-trivy-report.json
          retention-days: 7
      - name: Publish only dedicated web tag
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/master'
        run: |
          docker push ghcr.io/shaoyou11/efb-web-standby:20260927
          docker push ghcr.io/shaoyou11/efb-web-standby:${{ github.sha }}
