name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags: [ 'v*.*.*' ]
  pull_request:
    paths:
      - 'Dockerfile'
      - 'constraints.lock'
      - '.github/workflows/ci.yaml'

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Canary build (no push)
        uses: docker/build-push-action@v6
        with:
          cache-from: |
            type=gha
            type=gha,stage=builder
          cache-to: |
            type=gha,mode=max,stage=builder
            type=gha,mode=max
          file: Dockerfile
          platforms: linux/amd64
          context: ./
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/efb:canary-${{ github.event.pull_request.number }}
          build-args: |
            EFB_IMAGE_BUILD_TIME=${{ github.event.pull_request.updated_at }}
            EFB_IMAGE_REVISION=canary-${{ github.event.pull_request.head.sha }}

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set build metadata
        id: metadata
        run: |
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "source_ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # https://github.com/actions/checkout/issues/290#issuecomment-680260080
      - name: Extract Docker Info
        id: docker
        run: |
          git fetch --tags --force # Retrieve annotated tags. THIS TRICK REALLY HELPS
          # https://github.com/community/community/discussions/4924
          # git release do not create annotated tags, so we need use --tags
          tag=$(git describe --always --tags --abbrev=8 HEAD)
          version=$tag
          echo "version=$version" >> $GITHUB_ENV

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker
        uses: docker/build-push-action@v6
        with:
          cache-from: |
            type=gha
            type=gha,stage=builder
          cache-to: |
            type=gha,mode=max,stage=builder
            type=gha,mode=max
          file: 'Dockerfile'
          platforms: linux/amd64,linux/arm64
          context: ./
          push: true
          build-args: |
            EFB_IMAGE_BUILD_TIME=${{ steps.metadata.outputs.build_time }}
            EFB_IMAGE_SOURCE_REF=${{ steps.metadata.outputs.source_ref }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/efb:latest
            ghcr.io/${{ github.repository_owner }}/efb:${{ env.version }}

  canary:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Set build metadata
        id: metadata
        run: |
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "source_ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build canary without publishing
        uses: docker/build-push-action@v6
        with:
          cache-from: |
            type=gha
            type=gha,stage=builder
          cache-to: |
            type=gha,mode=max,stage=builder
            type=gha,mode=max
          file: 'Dockerfile'
          platforms: linux/amd64,linux/arm64
          context: ./
          push: false
          build-args: |
            EFB_IMAGE_BUILD_TIME=${{ steps.metadata.outputs.build_time }}
            EFB_IMAGE_SOURCE_REF=${{ steps.metadata.outputs.source_ref }}
          tags: ghcr.io/${{ github.repository_owner }}/efb:canary
