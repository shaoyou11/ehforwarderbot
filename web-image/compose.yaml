name: efb-web-lab
services:
  web-check:
    image: efb-web-standby:20260927
    profiles: ["offline"]
    network_mode: none
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,nosuid,nodev,size=128m"]
    environment:
      EFB_WEB_ENABLE_LOGIN: "0"
  web-standby:
    user: "${EFB_WEB_UID:-10001}:${EFB_WEB_GID:-10001}"
    image: efb-web-standby:20260927
    profiles: ["standby"]
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,nosuid,nodev,size=128m"]
    environment:
      EFB_WEB_ENABLE_LOGIN: "0"
    dns: ["${EFB_DNS:?set private DNS}"]
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
    networks:
      bypass_router:
        ipv4_address: "${EFB_WEB_IPV4:?set reserved web address}"
networks:
  bypass_router:
    external: true
    name: "${EFB_LAN_NETWORK:?set existing network name}"
